<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <title>Carton</title>
</head>
<body>
    <nav class="background-menu" aria-label="Changer l'arrière-plan">
        <button class="menu-toggle" type="button" id="backgroundMenuToggle" aria-expanded="false" aria-controls="backgroundMenu" aria-label="Ouvrir le menu d'arrière-plan">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="menu-options" id="backgroundMenu" hidden>
            <button type="button" id="galleryButton">Galerie</button>
            <button type="button" id="cameraButton">Prendre une photo</button>
            <button type="button" id="gradientButton">Dégradé aléatoire</button>
        </div>
        <input type="file" id="galleryInput" accept="image/*" hidden>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    </nav>

    <img src="" class="bg-carton" alt="" aria-hidden="true">

    <div class="carton" aria-label="Carton de loto"></div>

    <script>
        const backgroundImage = document.querySelector('.bg-carton');
        const galleryInput = document.getElementById('galleryInput');
        const cameraInput = document.getElementById('cameraInput');
        const backgroundMenu = document.getElementById('backgroundMenu');
        const backgroundMenuToggle = document.getElementById('backgroundMenuToggle');
        let backgroundObjectUrl;

        backgroundMenuToggle.addEventListener('click', () => {
            const isExpanded = backgroundMenuToggle.getAttribute('aria-expanded') === 'true';
            backgroundMenu.hidden = isExpanded;
            backgroundMenuToggle.setAttribute('aria-expanded', String(!isExpanded));
            backgroundMenuToggle.setAttribute(
                'aria-label',
                isExpanded ? "Ouvrir le menu d'arrière-plan" : "Fermer le menu d'arrière-plan"
            );
        });

        function shuffle(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function createRandomGradient() {
            const firstRandomHue = Math.floor(Math.random() * 360);
            const hueSeparation = 145 + Math.floor(Math.random() * 71);
            const secondRandomHue = (firstRandomHue + hueSeparation) % 360;
            const gradientAngle = Math.floor(Math.random() * 360);
            return `linear-gradient(${gradientAngle}deg in oklch, hsl(${firstRandomHue}, 78%, 43%), hsl(${secondRandomHue}, 78%, 43%))`;
        }

        async function setBackgroundImage(file) {
            if (!file.type.startsWith('image/')) {
                window.alert('Veuillez choisir un fichier image.');
                return;
            }

            const nextObjectUrl = URL.createObjectURL(file);
            const imageToLoad = new Image();
            imageToLoad.src = nextObjectUrl;

            try {
                await imageToLoad.decode();
            } catch {
                URL.revokeObjectURL(nextObjectUrl);
                window.alert('Impossible de charger cette image.');
                return;
            }

            if (backgroundObjectUrl) {
                URL.revokeObjectURL(backgroundObjectUrl);
            }

            backgroundObjectUrl = nextObjectUrl;
            backgroundImage.src = nextObjectUrl;
            backgroundImage.hidden = false;
            document.body.style.background = '#fff';
        }

        function handleBackgroundFileChange(event) {
            const input = event.currentTarget;
            const file = input.files[0];
            input.value = '';

            if (file) {
                setBackgroundImage(file);
            }
        }

        document.getElementById('galleryButton').addEventListener('click', () => {
            galleryInput.click();
        });
        document.getElementById('cameraButton').addEventListener('click', () => {
            cameraInput.click();
        });
        function setRandomBackground() {
            backgroundImage.hidden = true;
            document.body.style.background = createRandomGradient();
        }
        setRandomBackground() // at start
        document.getElementById('gradientButton').addEventListener('click', () => {
            setRandomBackground();
        });
        galleryInput.addEventListener('change', handleBackgroundFileChange);
        cameraInput.addEventListener('change', handleBackgroundFileChange);

        backgroundImage.hidden = true;
        document.body.style.background = createRandomGradient();

        function createColumnNumbers(column) {
            const firstNumber = column === 0 ? 1 : column * 10;
            const lastNumber = column === 8 ? 90 : firstNumber + 9;
            return shuffle(
                Array.from(
                    { length: lastNumber - firstNumber + 1 },
                    (_, index) => firstNumber + index
                )
            );
        }

        function createGrid() {
            let positions;

            do {
                const columnsWithTwoNumbers = new Set(
                    shuffle(Array.from({ length: 9 }, (_, column) => column)).slice(0, 6)
                );
                const rowCounts = [0, 0, 0];

                positions = Array.from({ length: 3 }, () => Array(9).fill(null));

                for (let column = 0; column < 9; column++) {
                    const numberOfNumbers = columnsWithTwoNumbers.has(column) ? 2 : 1;
                    const rows = shuffle([0, 1, 2]);

                    rows.slice(0, numberOfNumbers).forEach((row) => {
                        positions[row][column] = true;
                        rowCounts[row]++;
                    });
                }
            } while (positions.some((row, index) => row.filter(Boolean).length !== 5));

            return positions;
        }

        function renderCarton(carton) {
            const positions = createGrid();
            const numbersByColumn = Array.from(
                { length: 9 },
                (_, column) => createColumnNumbers(column)
            );

            positions.forEach((row, rowIndex) => {
                row.forEach((hasNumber, columnIndex) => {
                    const cell = document.createElement('div');
                    cell.classList.add('nombre');

                    if (hasNumber) {
                        cell.textContent = numbersByColumn[columnIndex].pop();
                        cell.setAttribute('role', 'button');
                        cell.setAttribute('tabindex', '0');
                        cell.setAttribute('aria-pressed', 'false');
                        cell.addEventListener('click', () => {
                            requestMobileFullscreen();
                            togglePastille(cell);
                        });
                        cell.addEventListener('keydown', (event) => {
                            if (event.key === 'Enter' || event.key === ' ') {
                                event.preventDefault();
                                requestMobileFullscreen();
                                togglePastille(cell);
                            }
                        });
                    } else {
                        cell.classList.add('vide');
                    }

                    cell.setAttribute('aria-label', hasNumber ? `Numéro ${cell.textContent}` : 'Case vide');
                    carton.appendChild(cell);
                });
            });
        }

        function togglePastille(cell) {
            const existingPastille = cell.querySelector('.pastille');

            if (existingPastille) {
                existingPastille.remove();
                cell.setAttribute('aria-pressed', 'false');
                return;
            }

            const pastille = document.createElement('span');
            const randomHue = Math.floor(Math.random() * 360);
            pastille.classList.add('pastille');
            pastille.style.backgroundColor = `hsl(${randomHue}, 100%, 50%)`;
            cell.appendChild(pastille);
            cell.setAttribute('aria-pressed', 'true');
        }

        function requestMobileFullscreen() {
            // TODO TESTER MOBILE FULLSCREEN
            // TODO tester le bg bleu moche sur mobile

            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        document.querySelectorAll('.carton').forEach(renderCarton);
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            user-select: none;
        }

        .background-menu {
            position: fixed;
            z-index: 2;
            top: max(10px, env(safe-area-inset-top));
            right: max(10px, env(safe-area-inset-right));
        }

        .background-menu button {
            border: 1px solid #d5ded7;
            border-radius: 6px;
            background: #fff;
            color: #18352f;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            justify-self: end;
        }

        .background-menu button:focus-visible {
            outline: 2px solid #cf4935;
            outline-offset: 2px;
        }

        .menu-toggle {
            display: grid;
            width: 46px;
            height: 46px;
            place-content: center;
            gap: 5px;
            box-shadow: 0 2px 8px #0002;
        }

        .menu-toggle span {
            width: 22px;
            height: 2px;
            border-radius: 2px;
            background: #18352f;
            transition: opacity 150ms ease, transform 150ms ease;
        }

        .menu-toggle[aria-expanded="true"] span:first-child {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle[aria-expanded="true"] span:last-child {
            transform: translateY(-7px) rotate(-45deg);
        }

        .menu-options {
            display: grid;
            gap: 6px;
            min-width: 180px;
            margin-top: 6px;
            padding: 6px;
        }

        .menu-options[hidden] {
            display: none;
        }

        .menu-options button {
            min-height: 44px;
            padding: 8px 12px;
            text-align: left;
        }

        .bg-carton {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .bg-carton[hidden] {
            display: none;
        }

        .carton {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            height: 100vh;
            height: 100dvh;
        }

        .nombre {
            position: relative;
            display: grid;
            height: calc(100vh / 3);
            height: calc(100dvh / 3);
            place-items: center;
            font-size: 6vw;
            font-weight: 400;
            background: #fff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nombre.vide {
            background: transparent;
            cursor: default;
        }

        .pastille {
            position: absolute;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            opacity: 0.6;
            transition: opacity 0.1s ease-in;
        }
    </style>
</body>
</html>
